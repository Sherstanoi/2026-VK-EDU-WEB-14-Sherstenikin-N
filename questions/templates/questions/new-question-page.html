{% extends 'questions/layout/base_logout.html' %}
{%block head%}
    {% load static %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Simple App</title>
        <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="{% static 'new-question.css' %}"> 
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
{%endblock%}
        {%block content%}
        <div id = "header-info">
            <h1 id = "page-type">New question</h1>
        </div>
    </header>
    <div id = "main-body">
        <div id = "inputs-mama">
            <div id = "title-input" class = "inputs">
                <div class = naming>title:</div>
                <input id = "title-text" class = "main-input" placeholder="What is yout question?">
            </div>
            <div id = "text-input" class = "inputs">
                <div class = naming-special>thoughts:</div>
                <textarea id = "thoughts-text" class = "main-input" type = "text" placeholder="What are your thoughts on it?"></textarea>
             </div>
            <div id = "tags-input" class = "inputs">
                <div class = naming>tags:</div>
                <input id = "tags-text" class = "main-input" placeholder="What are its tags?">
            </div>
        </div>
        {%endblock%}
        {%block button%}
        <div id = "another-pages">
            <button class = "ask-button my-button">ASK</button>
        </div> 
        {%endblock%}
