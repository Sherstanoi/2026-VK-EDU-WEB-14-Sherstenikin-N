<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple App</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="new-question.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <div id = "header-main">
            <h1 id = "page-name">Truth Seeker</h1>
            <div id = "inputs">          
                <input placeholder="What are you searhing, traveller?">
                <button class = "my-button seek-btn top-button-2">Seek</button>

            </div>

            <div id = "profile">
                <div id = "profile-info">
                    <div id = "name">ENTER:</div>
                    <div id = "profile-buttons"> 
                        <button class = "cool-button my-button"> <i class="bi bi-caret-right-fill my-bi "></i> Log in<i class="bi bi-caret-left-fill my-bi"></i></button>
                        <button class = "cool-button my-button"> <i class="bi bi-caret-right-fill my-bi "></i> Register<i class="bi bi-caret-left-fill my-bi"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div id = "header-line"></div>

        <div id = "header-info">
            <h1 id = "page-type">New question</h1>
        </div>
    </header>

    <div id = "main-body">
        <div id = "inputs-mama">
            <div id = "title-input" class = "inputs">
                <div class = naming>title:</div>
                <input id = "title-text" class = "main-input" placeholder="What is yout question?">
            </div>
            <div id = "text-input" class = "inputs">
                <div class = naming-special>thoughts:</div>
                <textarea id = "thoughts-text" class = "main-input" type = "text" placeholder="What are your thoughts on it?"></textarea>
            </div>
            <div id = "tags-input" class = "inputs">
                <div class = naming>tags:</div>
                <input id = "tags-text" class = "main-input" placeholder="What are its tags?">
            </div>
        </div>

        <div id = "additional-info">

            <div id = "popular-tags">
                <h2 class = "name-of-section">Popular tags</h2>
                <a class = "tag">life</a>
                <a class = "tag">dreams</a>
                <a class = "tag">gods</a>
                <a class = "tag">games</a>
                <a class = "tag">government</a>
                <a class = "tag">art</a>
                <a class = "tag">cryptids</a>
                <a class = "tag">news</a>
                <a class = "tag">ghosts</a>
            </div>

            <div id = "cool-members">
                <h2 class = "name-of-section">Best Members</h2>
                <div class = "member"><a href = "https::google.com">Harry Du Bois</a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
                <div class = "member"><a href = "https::google.com">Mae Borowski </a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
                <div class = "member"><a href = "https::google.com">L0g-01</a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
                <div class = "member"><a href = "https::google.com">Paper crane</a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
                <div class = "member"><a href = "https::google.com">Olesha</a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
                <div class = "member"><a href = "https::google.com">Heins Fufelshmerts</a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
                <div class = "member"><a href = "https::google.com">Jessie Pinkman</a> <i class="bi bi-caret-left-fill my-bi"></i> </div>
            </div>
        </div>
        <div id = "another-pages">
            <button class = "ask-button my-button">ASK</button>
        </div>
    </div>


    <footer>

    </footer>
</body>
</html>
